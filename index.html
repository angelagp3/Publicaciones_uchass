<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producción científica de U^CHASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --red:#e00000; --red-dark:#7a0000; --ink:#1a2338; --panel:#111; --muted:#5b6270;
    --line:#e4e4e4; --soft:#fafafa; --paper:#fff;
    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
  header{text-align:center;padding-bottom:20px;border-bottom:3px solid #000}
  .source{font-size:.85rem;color:var(--muted);margin:0 0 6px}
  .source a{color:inherit}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.01em}
  .lead{font-style:italic;color:var(--muted);margin:0;font-size:1.05rem}

  .top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:28px}
  .panel{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px 16px 10px}
  .chart-box{position:relative;height:300px}
  .hint{font-size:.8rem;color:var(--muted);margin:6px 0 0;text-align:center}
  .kpis{display:grid;grid-template-rows:1fr 1fr;gap:16px}
  .kpi{background:var(--panel);color:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px;text-align:center}
  .kpi b{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5vw,3rem);line-height:1}
  .kpi span{margin-top:8px;font-size:.95rem;letter-spacing:.04em;color:#ddd}

  .filters{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;align-items:center;margin:30px 0 0;padding-top:24px;border-top:1px solid var(--line)}
  .filters label{display:flex;align-items:center;gap:10px;font-size:1rem;color:var(--ink)}
  select{font:inherit;color:var(--ink);background:#fff;border:1px solid #cfd4dc;border-radius:6px;padding:10px 12px;min-width:120px;max-width:260px}
  button{font:inherit;cursor:pointer}
  .btn-reset{background:var(--red);color:#fff;border:0;border-radius:5px;padding:8px 16px}
  .btn-reset:hover{background:#b80000}
  :focus-visible{outline:3px solid #1a2338;outline-offset:2px}

  .status{margin:26px 0 8px;color:var(--muted);text-align:center;font-size:.95rem}
  ul.pubs{list-style:none;margin:0;padding:0}
  .pub{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
  .pub .y{font-family:var(--display);font-size:1.25rem;color:var(--red)}
  .pub a{color:var(--ink);text-decoration-color:#bbb;text-underline-offset:3px}
  .pub a:hover{color:var(--red);text-decoration-color:var(--red)}
  .pub .authors{grid-column:2;font-size:.92rem;color:var(--muted);margin-top:2px}
  .pub .doi{grid-column:2;font-size:.88rem;overflow-wrap:anywhere}
  .pub .meta{grid-column:2;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
  .oa{border:1px solid var(--red);color:var(--red);border-radius:999px;padding:0 8px;font-size:.78rem}
  .more{display:block;margin:22px auto 0;background:#fff;border:1px solid var(--ink);border-radius:5px;padding:10px 22px;color:var(--ink)}
  .more:hover{background:var(--ink);color:#fff}
  .error{background:#fff4f4;border:1px solid var(--red);border-radius:8px;padding:16px;text-align:center}
  footer{margin-top:36px;text-align:center;font-size:.82rem;color:var(--muted)}

  @media (max-width:820px){
    .top{grid-template-columns:1fr}
    .kpis{grid-template-rows:none;grid-template-columns:1fr 1fr}
    .chart-box{height:260px}
  }
  @media (max-width:480px){
    .kpis{grid-template-columns:1fr}
    .pub{grid-template-columns:52px minmax(0,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="source">Datos de <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a></p>
    <h1>Producción científica de U^CHASS</h1>
    <p class="lead">Las publicaciones de nuestros miembros, año a año, actualizadas automáticamente.</p>
  </header>

  <main>
    <section class="top" aria-label="Resumen">
      <div class="panel">
        <div class="chart-box"><canvas id="chart" role="img" aria-label="Publicaciones por año"></canvas></div>
        <p class="hint">Haz clic en una barra para filtrar por año.</p>
      </div>
      <div class="kpis">
        <div class="kpi"><b id="kTotal">–</b><span>Publicaciones</span></div>
        <div class="kpi"><b id="kOA">–</b><span>En acceso abierto</span></div>
      </div>
    </section>

    <section class="filters" aria-label="Filtros">
      <label for="fYear">Año
        <select id="fYear"><option value="">Todos</option></select>
      </label>
      <label for="fType">Tipo
        <select id="fType"><option value="">Todos</option></select>
      </label>
      <button class="btn-reset" id="reset" type="button">Quitar filtros</button>
    </section>

    <p class="status" id="status" aria-live="polite"></p>
    <ul class="pubs" id="list"></ul>
    <button class="more" id="more" type="button" hidden>Mostrar más</button>
    <div id="error" class="error" hidden></div>
  </main>

  <footer id="foot">Fuente: OpenAlex.</footer>
</div>

<script>
const DATA_URL = "data.json";
const PAGE = 30;

const TIPOS = {
  "article":"Artículo", "book-chapter":"Capítulo de libro", "book":"Libro",
  "preprint":"Preprint", "dataset":"Conjunto de datos", "dissertation":"Tesis",
  "review":"Reseña", "editorial":"Editorial", "letter":"Carta", "report":"Informe",
  "reference-entry":"Entrada de referencia", "peer-review":"Revisión por pares",
  "paratext":"Paratexto", "erratum":"Corrección", "retraction":"Retractación",
  "standard":"Norma", "grant":"Proyecto", "supplementary-materials":"Material suplementario",
  "libguides":"Guía", "other":"Otro"
};
const tipo = t => TIPOS[t] || t || "Otro";
const nf = new Intl.NumberFormat("es-ES");
const $ = id => document.getElementById(id);

let works = [], years = [], chart = null, shown = PAGE;
const state = { year: "", type: "" };

const clean = t => t ? new DOMParser().parseFromString(t, "text/html").body.textContent.trim() : "(Sin título)";

fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); updateFooter(r.headers.get("Last-Modified")); return r.json(); })
  .then(d => { works = d.filter(w => Number.isInteger(w.year) && w.year >= 2000 && w.year <= 2026); start(); })
  .catch(() => {
    const e = $("error");
    e.hidden = false;
    e.textContent = "No se pudieron cargar los datos. Inténtalo de nuevo más tarde.";
  });

function updateFooter(lm){
  if(!lm) return;
  const f = new Date(lm).toLocaleDateString("es-ES", {day:"numeric", month:"long", year:"numeric"});
  $("foot").textContent = "Fuente: OpenAlex. Última actualización: " + f + ".";
}

function start(){
  const ys = works.map(w => w.year);
  years = []; for (let y = 2000; y <= 2026; y++) years.push(y);

  $("fYear").innerHTML = '<option value="">Todos</option>' +
    [...years].reverse().map(y => `<option value="${y}">${y}</option>`).join("");

  const tc = {}; works.forEach(w => tc[w.type] = (tc[w.type] || 0) + 1);
  $("fType").innerHTML = '<option value="">Todos</option>' +
    Object.keys(tc).sort((a,b) => tc[b]-tc[a])
      .map(t => `<option value="${t}">${tipo(t)} (${nf.format(tc[t])})</option>`).join("");

  $("fYear").onchange = e => { state.year = e.target.value; shown = PAGE; render(); };
  $("fType").onchange = e => { state.type = e.target.value; shown = PAGE; render(); };
  $("reset").onclick = () => { state.year = state.type = ""; $("fYear").value = $("fType").value = ""; shown = PAGE; render(); };
  $("more").onclick = () => { shown += PAGE; renderList(currentSel()); };

  chart = new Chart($("chart"), {
    type: "bar",
    data: { labels: years, datasets: [{ data: [], backgroundColor: [], borderRadius: 3 }] },
    options: {
      maintainAspectRatio: false,
      animation: { duration: 250 },
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => nf.format(c.parsed.y) + " publicaciones" } } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#ececec" } },
        x: { grid: { display: false }, ticks: { maxRotation: 60, minRotation: 45 } }
      },
      onClick: (_, els) => {
        if (!els.length) return;
        const y = String(years[els[0].index]);
        state.year = state.year === y ? "" : y;
        $("fYear").value = state.year; shown = PAGE; render();
      },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; }
    }
  });
  render();
}

function currentSel(){
  return works.filter(w =>
    (!state.type || w.type === state.type) && (!state.year || String(w.year) === state.year));
}

function render(){
  // El gráfico respeta el filtro de tipo; el filtro de año resalta la barra.
  const byType = works.filter(w => !state.type || w.type === state.type);
  const counts = {}; byType.forEach(w => counts[w.year] = (counts[w.year] || 0) + 1);
  const ds = chart.data.datasets[0];
  ds.data = years.map(y => counts[y] || 0);
  ds.backgroundColor = years.map(y => state.year && String(y) === state.year ? "#7a0000" : "#e00000");
  chart.update();

  const sel = currentSel();
  $("kTotal").textContent = nf.format(sel.length);
  $("kOA").textContent = nf.format(sel.filter(w => w.oa).length);
  renderList(sel);
}

function renderList(sel){
  sel = [...sel].sort((a,b) => b.year - a.year || (a.title||"").localeCompare(b.title||"", "es"));
  const list = $("list"); list.textContent = "";
  sel.slice(0, shown).forEach(w => {
    const li = document.createElement("li"); li.className = "pub";
    const y = document.createElement("span"); y.className = "y"; y.textContent = w.year;
    const body = document.createElement("div");
    const href = [w.doi, w.id].find(u => u && /^https:\/\//.test(u));
    const title = clean(w.title);
    if (href) { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = title; body.append(a); }
    else body.textContent = title;
    const meta = document.createElement("div"); meta.className = "meta";
    const t = document.createElement("span"); t.textContent = tipo(w.type); meta.append(t);
    if (w.oa) { const o = document.createElement("span"); o.className = "oa"; o.textContent = "Acceso abierto"; meta.append(o); }
    li.append(y, body);
    if (Array.isArray(w.authors) && w.authors.length) {
      const authors = document.createElement("div"); authors.className = "authors";
      authors.textContent = "Autores: " + w.authors.join(", ");
      li.append(authors);
    }
    if (w.doi) {
      const doi = document.createElement("div"); doi.className = "doi";
      doi.append("DOI: ");
      const doiLink = document.createElement("a");
      const normalizedDoi = String(w.doi).replace(/^https?:\/\/(dx\.)?doi\.org\//i, "");
      doiLink.href = "https://doi.org/" + encodeURI(normalizedDoi);
      doiLink.textContent = normalizedDoi;
      doiLink.target = "_blank"; doiLink.rel = "noopener";
      doi.append(doiLink); li.append(doi);
    }
    li.append(meta);
    list.append(li);
  });
  $("status").textContent = sel.length
    ? `Mostrando ${nf.format(Math.min(shown, sel.length))} de ${nf.format(sel.length)} publicaciones`
    : "No hay publicaciones con estos filtros. Prueba a quitar alguno.";
  const rest = sel.length - shown;
  $("more").hidden = rest <= 0;
  $("more").textContent = `Mostrar más (${nf.format(Math.max(rest,0))} restantes)`;
  notifyHeight();
}

// Permite que la página de WordPress ajuste la altura del iframe (opcional).
function notifyHeight(){
  try { parent.postMessage({ uchassHeight: document.documentElement.scrollHeight }, "*"); } catch(e){}
}
addEventListener("resize", notifyHeight);
</script>
</body>
</html>
