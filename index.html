<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producción científica de U^CHASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--paper:#f1efe8;--ink:#111;--muted:#626159;--line:#cbc9c0;--accent:#b53926;--white:#faf9f5;--sans:Arial,Helvetica,sans-serif;--serif:Georgia,'Times New Roman',serif}
  *{box-sizing:border-box}
  html{color-scheme:light;background:var(--paper)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.42;overflow-x:hidden}
  .wrap{max-width:1450px;margin:0 auto;padding:16px 24px 34px}
  .intro{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:12px 0 22px;border-bottom:1px solid var(--ink)}
  .eyebrow{font:700 .74rem/1.3 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h1{font:700 clamp(1.5rem,2.35vw,2.25rem)/1.13 var(--sans);letter-spacing:-.035em;margin:0}
  .lead{font:400 .95rem/1.5 var(--serif);color:var(--muted);margin:8px 0 0}
  .source{flex:none;font:.82rem var(--sans);color:var(--muted);margin:0 0 2px}
  .source a{color:inherit;text-underline-offset:3px}
  .top{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;margin-top:20px}
  .panel{border:1px solid var(--line);border-radius:3px;padding:14px 18px 6px;background:transparent;min-width:0}
  .section-kicker{font:700 .7rem var(--sans);text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
  .chart-box{position:relative;height:225px;margin-top:9px}
  .hint{font:.76rem var(--sans);color:var(--muted);margin:6px 0 4px}
  .kpis{display:grid;grid-template-rows:1fr 1fr;gap:14px}
  .kpi{border:1px solid #171717;color:#f6f3ed;background:#171717;display:flex;flex-direction:column;justify-content:center;padding:13px 18px}
  .kpi b{font:700 clamp(2rem,3.4vw,2.7rem)/1 var(--sans);letter-spacing:-.045em}
  .kpi span{font:.74rem/1.35 var(--sans);text-transform:uppercase;letter-spacing:.07em;color:#d8d3c9;margin-top:9px}
  .toolbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between;padding:20px 0 15px;border-bottom:1px solid var(--line)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;flex:1}
  .filters label,.search-label{font:700 .7rem/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;flex-direction:column;gap:6px}
  select,input[type=search]{background:transparent;border:1px solid #a7a59b;border-radius:2px;color:var(--ink);padding:9px 11px;min-height:39px;font:400 .87rem var(--sans)}
  select{min-width:150px;max-width:260px}
  .search-label{flex:1;min-width:190px;max-width:330px}
  input[type=search]{width:100%;min-width:0}
  button{cursor:pointer;font:700 .8rem var(--sans)}
  .btn-reset{border:1px solid #171717;color:#171717;background:transparent;padding:10px 13px;min-height:39px;border-radius:2px}
  .btn-reset:hover,.more:hover{background:#171717;color:#fff}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .listing-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px;margin:17px 0 12px}
  .listing-head h2{font:700 1.1rem var(--sans);letter-spacing:-.02em;margin:0}
  .status{font:.8rem var(--sans);color:var(--muted);margin:0}
  ul.pubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
  .pub{border:1px solid var(--line);background:rgba(255,255,255,.26);padding:15px 16px 13px;display:flex;flex-direction:column;gap:7px;min-width:0;min-height:160px;transition:border-color .16s,background .16s}
  .pub:hover{border-color:#8d8a80;background:rgba(255,255,255,.55)}
  .pub-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pub .y{font:700 .8rem var(--sans);color:var(--accent)}
  .pub .kind{font:.7rem/1.3 var(--sans);color:var(--muted);text-align:right}
  .pub .pub-title{font:700 .95rem/1.32 var(--serif);color:var(--ink);margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
  .pub .pub-title a{color:inherit;text-decoration:none}
  .pub .pub-title a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
  .pub .authors{font:.77rem/1.38 var(--sans);color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
  .pub .bottom{margin-top:auto;display:flex;flex-wrap:wrap;gap:7px 10px;align-items:center;padding-top:5px}
  .pub .doi{font:.73rem/1.3 var(--sans);min-width:0;overflow-wrap:anywhere}
  .pub .doi a{color:var(--accent);text-decoration:none}
  .pub .doi a:hover{text-decoration:underline}
  .oa{font:700 .65rem var(--sans);color:#276343;border:1px solid #9fb7aa;padding:3px 6px;white-space:nowrap}
  .more{display:block;margin:22px auto 5px;background:transparent;border:1px solid var(--ink);border-radius:2px;padding:12px 22px;color:var(--ink)}
  .error{border:1px solid var(--accent);padding:14px;font:.9rem var(--sans);margin-top:12px}
  footer{padding-top:24px;font:.75rem var(--sans);color:var(--muted)}
  @media(max-width:1000px){ul.pubs{grid-template-columns:repeat(2,minmax(0,1fr))}.top{grid-template-columns:minmax(0,1fr) 200px}}
  @media(max-width:660px){.wrap{padding:8px 14px 28px}.intro{display:block}.source{margin-top:10px}.top{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr;grid-template-rows:none}.chart-box{height:205px}ul.pubs{grid-template-columns:1fr}.pub{min-height:0}.filters label{flex:1;min-width:130px}.filters select{width:100%;min-width:0}.search-label{max-width:none;flex-basis:100%}.listing-head{display:block}.status{margin-top:6px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <div><p class="eyebrow">U^CHASS · Investigación</p>
      <h1>La investigación, en cifras</h1>
      <p class="lead">Publicaciones científicas de nuestros miembros · 2000–2026</p></div>
    <p class="source">Fuente: <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a></p>
  </header>
  <main>
    <section class="top" aria-label="Resumen bibliométrico">
      <div class="panel"><span class="section-kicker">Evolución anual de publicaciones</span>
        <div class="chart-box"><canvas id="chart" role="img" aria-label="Publicaciones por año"></canvas></div>
        <p class="hint">Selecciona una barra para filtrar los resultados por año.</p>
      </div>
      <div class="kpis">
        <div class="kpi"><b id="kTotal">—</b><span>Publicaciones</span></div>
        <div class="kpi"><b id="kOA">—</b><span>En acceso abierto</span></div>
      </div>
    </section>
    <section class="toolbar" aria-label="Filtros de publicaciones">
      <div class="filters">
        <label for="fYear">Año<select id="fYear"><option value="">Todos</option></select></label>
        <label for="fType">Tipo de documento<select id="fType"><option value="">Todos</option></select></label>
        <label class="search-label" for="fSearch">Buscar publicación<input id="fSearch" type="search" placeholder="Título, autor o DOI" autocomplete="off"></label>
        <button class="btn-reset" id="reset" type="button">Quitar filtros</button>
      </div>
    </section>
    <div class="listing-head"><h2>Publicaciones</h2><p class="status" id="status" aria-live="polite"></p></div>
    <ul class="pubs" id="list"></ul>
    <button class="more" id="more" type="button" hidden>Mostrar más publicaciones</button>
    <div id="error" class="error" hidden></div>
  </main>
  <footer id="foot">Fuente: OpenAlex.</footer>
</div>

<script>
const DATA_URL = "data.json";
const PAGE = 18;

const TIPOS = {
  "article":"Artículo", "book-chapter":"Capítulo de libro", "book":"Libro",
  "preprint":"Preprint", "dataset":"Conjunto de datos", "dissertation":"Tesis",
  "review":"Reseña", "editorial":"Editorial", "letter":"Carta", "report":"Informe",
  "reference-entry":"Entrada de referencia", "peer-review":"Revisión por pares",
  "paratext":"Paratexto", "erratum":"Corrección", "retraction":"Retractación",
  "standard":"Norma", "grant":"Proyecto", "supplementary-materials":"Material suplementario",
  "libguides":"Guía", "other":"Otro"
};
const tipo = t => TIPOS[t] || t || "Otro";
const nf = new Intl.NumberFormat("es-ES");
const $ = id => document.getElementById(id);

let works = [], years = [], chart = null, shown = PAGE;
const state = { year: "", type: "", search: "" };

const clean = t => t ? new DOMParser().parseFromString(t, "text/html").body.textContent.trim() : "(Sin título)";

fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); updateFooter(r.headers.get("Last-Modified")); return r.json(); })
  .then(d => { works = d.filter(w => Number.isInteger(w.year) && w.year >= 2000 && w.year <= 2026); start(); })
  .catch(() => {
    const e = $("error");
    e.hidden = false;
    e.textContent = "No se pudieron cargar los datos. Inténtalo de nuevo más tarde.";
  });

function updateFooter(lm){
  if(!lm) return;
  const f = new Date(lm).toLocaleDateString("es-ES", {day:"numeric", month:"long", year:"numeric"});
  $("foot").textContent = "Fuente: OpenAlex. Última actualización: " + f + ".";
}

function start(){
  const ys = works.map(w => w.year);
  years = []; for (let y = 2000; y <= 2026; y++) years.push(y);

  $("fYear").innerHTML = '<option value="">Todos</option>' +
    [...years].reverse().map(y => `<option value="${y}">${y}</option>`).join("");

  const tc = {}; works.forEach(w => tc[w.type] = (tc[w.type] || 0) + 1);
  $("fType").innerHTML = '<option value="">Todos</option>' +
    Object.keys(tc).sort((a,b) => tc[b]-tc[a])
      .map(t => `<option value="${t}">${tipo(t)} (${nf.format(tc[t])})</option>`).join("");

  $("fYear").onchange = e => { state.year = e.target.value; shown = PAGE; render(); };
  $("fType").onchange = e => { state.type = e.target.value; shown = PAGE; render(); };
  $("fSearch").oninput = e => { state.search = e.target.value.toLocaleLowerCase("es").trim(); shown = PAGE; render(); };
  $("reset").onclick = () => { state.year = state.type = state.search = ""; $("fYear").value = $("fType").value = $("fSearch").value = ""; shown = PAGE; render(); };
  $("more").onclick = () => { shown += PAGE; renderList(currentSel()); };

  chart = new Chart($("chart"), {
    type: "bar",
    data: { labels: years, datasets: [{ data: [], backgroundColor: [], borderRadius: 3 }] },
    options: {
      maintainAspectRatio: false,
      animation: { duration: 250 },
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => nf.format(c.parsed.y) + " publicaciones" } } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#d8d5cb" } },
        x: { grid: { display: false }, ticks: { maxRotation: 60, minRotation: 45 } }
      },
      onClick: (_, els) => {
        if (!els.length) return;
        const y = String(years[els[0].index]);
        state.year = state.year === y ? "" : y;
        $("fYear").value = state.year; shown = PAGE; render();
      },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; }
    }
  });
  render();
}

function currentSel(){
  return works.filter(w =>
    (!state.type || w.type === state.type) &&
    (!state.year || String(w.year) === state.year) &&
    (!state.search || [w.title, ...(Array.isArray(w.authors) ? w.authors : []), w.doi]
      .filter(Boolean).join(" ").toLocaleLowerCase("es").includes(state.search))
  );
}

function render(){
  // El gráfico respeta el filtro de tipo; el filtro de año resalta la barra.
  const byType = works.filter(w => !state.type || w.type === state.type);
  const counts = {}; byType.forEach(w => counts[w.year] = (counts[w.year] || 0) + 1);
  const ds = chart.data.datasets[0];
  ds.data = years.map(y => counts[y] || 0);
  ds.backgroundColor = years.map(y => state.year && String(y) === state.year ? "#111111" : "#b53926");
  chart.update();

  const sel = currentSel();
  $("kTotal").textContent = nf.format(sel.length);
  $("kOA").textContent = nf.format(sel.filter(w => w.oa).length);
  renderList(sel);
}

function renderList(sel){
  sel = [...sel].sort((a,b) => b.year - a.year || (a.title||"").localeCompare(b.title||"", "es"));
  const list = $("list"); list.textContent = "";
  sel.slice(0, shown).forEach(w => {
    const li = document.createElement("li"); li.className = "pub";
    const head = document.createElement("div"); head.className = "pub-head";
    const year = document.createElement("span"); year.className = "y"; year.textContent = w.year;
    const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = tipo(w.type);
    head.append(year, kind); li.append(head);
    const title = document.createElement("h3"); title.className = "pub-title";
    const titleText = clean(w.title);
    const link = [w.doi, w.id].find(u => typeof u === "string" && /^https:\/\//.test(u));
    if(link){ const a = document.createElement("a"); a.href = link; a.target = "_blank"; a.rel = "noopener"; a.textContent = titleText; title.append(a); }
    else { title.textContent = titleText; }
    title.title = titleText; li.append(title);
    if(Array.isArray(w.authors) && w.authors.length){
      const authors = document.createElement("div"); authors.className="authors";
      authors.textContent = w.authors.join(", "); authors.title = authors.textContent; li.append(authors);
    }
    const bottom = document.createElement("div"); bottom.className="bottom";
    if(w.doi){
      const doi = document.createElement("span"); doi.className="doi";
      const doiLink=document.createElement("a");
      const normalizedDoi=String(w.doi).replace(/^https?:\/\/(dx\.)?doi\.org\//i, "");
      doiLink.href="https://doi.org/"+encodeURI(normalizedDoi);
      doiLink.textContent="DOI: "+normalizedDoi;
      doiLink.target="_blank"; doiLink.rel="noopener";
      doi.append(doiLink); bottom.append(doi);
    }
    if(w.oa){const oa=document.createElement("span"); oa.className="oa";oa.textContent="Acceso abierto";bottom.append(oa);}
    li.append(bottom); list.append(li);
  });
  $("status").textContent = sel.length
    ? `Mostrando ${nf.format(Math.min(shown, sel.length))} de ${nf.format(sel.length)}`
    : "No hay publicaciones con estos filtros.";
  const rest = sel.length - shown;
  $("more").hidden = rest <= 0;
  $("more").textContent = `Mostrar más (${nf.format(Math.max(rest,0))} restantes)`;
  requestAnimationFrame(notifyHeight);
}

// Permite que la página de WordPress ajuste la altura del iframe (opcional).
function notifyHeight(){
  try {
    const height = Math.ceil(document.body.scrollHeight + 5);
    parent.postMessage({ uchassHeight: height }, "*");
  } catch(e){}
}
addEventListener("resize", notifyHeight);
addEventListener("load", notifyHeight);
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(notifyHeight).observe(document.querySelector(".wrap"));
}
</script>
</body>
</html>
